<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>I.C.W.</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ===== 完整样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #0b0f17;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4a90e2, #a0c4ff, #4a90e2, transparent);
            box-shadow: 0 0 15px #4a90e2;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes scan {
            0% {
                top: -2px;
                opacity: 0.8;
            }
            100% {
                top: 100%;
                opacity: 0;
            }
        }
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 30% 40%, #1a2f4a 0%, #0a111f 100%);
        }
        .particle {
            position: absolute;
            background: rgba(100, 180, 255, 0.15);
            border-radius: 50%;
            filter: blur(3px);
            animation: float 12s infinite ease-in-out;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0) translateX(0);
            }
            25% {
                transform: translateY(-30px) translateX(15px);
            }
            50% {
                transform: translateY(-50px) translateX(-10px);
            }
            75% {
                transform: translateY(-20px) translateX(20px);
            }
        }
        .glass-orb {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1300px;
            height: 90vh;
            background: rgba(18, 28, 40, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 60px;
            border: 1px solid rgba(100, 180, 255, 0.25);
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            padding: 20px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(100, 180, 255, 0.2);
            background: rgba(8, 16, 26, 0.4);
            backdrop-filter: blur(10px);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #2b7cff, #00b0ff);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .logo-text {
            font-weight: 600;
            font-size: 1.6rem;
            color: #e0f0ff;
        }
        .user-badge {
            background: rgba(10, 25, 40, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 8px 20px 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(100, 180, 255, 0.3);
            color: #e2f0ff;
        }
        .user-badge .uid {
            background: #1e3b5e;
            padding: 4px 12px;
            border-radius: 30px;
            font-family: monospace;
        }
        .friend-request-badge {
            background: #ff4d4d;
            color: white;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 290px;
            background: rgba(12, 22, 34, 0.5);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(100, 180, 255, 0.15);
            display: flex;
            flex-direction: column;
            padding: 20px 0 20px 16px;
        }
        .profile-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            background: rgba(30, 50, 70, 0.4);
            border-radius: 36px;
            margin-right: 16px;
            border: 1px solid rgba(100, 180, 255, 0.2);
            cursor: pointer;
            transition: 0.25s;
        }
        .profile-card:hover {
            background: rgba(40, 70, 100, 0.5);
        }
        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: linear-gradient(145deg, #2b4b70, #1c3550);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #b8dcff;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .profile-info h4 {
            font-weight: 600;
            color: #e0f0ff;
        }
        .profile-info p {
            font-size: 0.8rem;
            color: #8bb4dd;
        }
        .contact-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
            padding-right: 8px;
        }
        .contact-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #6b93b5;
            padding: 16px 0 6px 12px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border-radius: 34px;
            margin-right: 8px;
            transition: 0.2s;
            cursor: pointer;
            color: #d0e6ff;
            border: 1px solid transparent;
        }
        .contact-item.active {
            background: rgba(40, 80, 120, 0.5);
            border-color: #4a9eff;
        }
        .contact-item:hover {
            background: rgba(50, 90, 140, 0.4);
        }
        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: linear-gradient(145deg, #2a4970, #1a314a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .contact-avatar:hover {
            transform: scale(1.05);
            border-color: #4a9eff;
        }
        .contact-info {
            flex: 1;
        }
        .contact-name {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .contact-tag {
            font-size: 0.65rem;
            color: #86a9c9;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(8, 18, 28, 0.3);
        }
        .chat-header {
            padding: 20px 35px;
            background: rgba(8, 18, 28, 0.5);
            border-bottom: 1px solid rgba(100, 180, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-title {
            font-weight: 600;
            font-size: 1.4rem;
            color: #d8ecff;
        }
        .chat-actions {
            display: flex;
            gap: 12px;
        }
        .action-btn {
            background: rgba(20, 45, 70, 0.7);
            border: 1px solid #2b6a9e;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #c0e4ff;
            cursor: pointer;
            transition: 0.2s;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:hover {
            background: #1b4c7a;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .message {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            max-width: 70%;
            animation: fadeIn 0.3s;
            position: relative;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message-avatar {
            width: 42px;
            height: 42px;
            border-radius: 21px;
            background: linear-gradient(145deg, #2e4c75, #1d334d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .message-avatar:hover {
            transform: scale(1.05);
            border-color: #4a9eff;
        }
        .message-bubble {
            background: rgba(30, 50, 75, 0.7);
            padding: 14px 20px;
            border-radius: 28px;
            border: 1px solid #2b5580;
            color: #e2f0ff;
            word-break: break-word;
            position: relative;
            flex: 1;
        }
        .message.own .message-bubble {
            background: #1a3d62;
            border-color: #4a9eff;
        }
        .message-sender {
            font-size: 0.7rem;
            color: #9acdff;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .message-time {
            font-size: 0.65rem;
            color: #6f96b5;
            margin-top: 6px;
            text-align: right;
        }
        .delete-msg-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 80, 80, 0.9);
            color: white;
            border: none;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: 0.2s;
        }
        .delete-msg-btn:hover {
            background: #ff4d4d;
            transform: scale(1.1);
        }
        .input-area {
            padding: 20px 35px;
            background: rgba(8, 18, 28, 0.6);
            border-top: 1px solid rgba(100, 180, 255, 0.15);
            display: flex;
            gap: 16px;
        }
        .input-area input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2b5580;
            border-radius: 50px;
            padding: 16px 25px;
            font-size: 1rem;
            color: #f0f8ff;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .input-area input:focus {
            border-color: #7abcff;
        }
        .send-btn {
            width: 60px;
            height: 60px;
            border-radius: 40px;
            background: linear-gradient(145deg, #2b7cff, #0055cc);
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 20, 0.7);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 16px;
        }
        .modal-card {
            background: rgba(18, 30, 45, 0.8);
            backdrop-filter: blur(35px);
            border-radius: 60px;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border: 1px solid rgba(100, 180, 255, 0.4);
            color: #e0f0ff;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-card h2 {
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 20px;
            color: #b8dcff;
        }
        .modal-input {
            width: 100%;
            padding: 16px 22px;
            border-radius: 50px;
            border: 1px solid #2b5580;
            background: rgba(0, 0, 0, 0.25);
            font-size: 1rem;
            margin: 10px 0;
            color: white;
            outline: none;
        }
        .modal-input:focus {
            border-color: #7abcff;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .modal-btn {
            padding: 12px 28px;
            border-radius: 40px;
            border: none;
            background: #2b7cff;
            color: white;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            font-size: 1rem;
        }
        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #4b6e8f;
            color: #cce4ff;
        }
        .error-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f17;
            padding: 20px;
        }
        .error-card {
            background: rgba(20, 30, 45, 0.8);
            backdrop-filter: blur(25px);
            border-radius: 50px;
            padding: 40px;
            text-align: center;
            color: #b8dcff;
            border: 1px solid #2b5580;
        }
        .hidden {
            display: none !important;
        }
        .friend-request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #2b5580;
        }
        .welcome-modal .modal-card {
            text-align: center;
        }
        .welcome-message {
            font-size: 2rem;
            margin: 20px 0;
            color: #b8dcff;
            word-break: break-word;
        }

        /* 加载提示 */
        #loadingIndicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            color: #8bb4dd;
            font-size: 1rem;
            background: rgba(11, 15, 23, 0.8);
            padding: 16px 32px;
            border-radius: 40px;
            border: 1px solid rgba(100, 180, 255, 0.3);
            backdrop-filter: blur(10px);
            display: none;
        }
        #loadingIndicator.show {
            display: block;
        }

        @media (max-width: 768px) {
            .glass-orb {
                border-radius: 30px;
                height: 95vh;
            }
            .app-header {
                padding: 15px 20px;
            }
            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
            .logo-text {
                font-size: 1.3rem;
            }
            .user-badge {
                padding: 5px 12px;
                font-size: 0.8rem;
            }
            .sidebar {
                width: 240px;
                padding-left: 8px;
            }
            .profile-card {
                padding: 12px;
                gap: 10px;
            }
            .avatar {
                width: 48px;
                height: 48px;
                font-size: 2rem;
            }
            .contact-item {
                padding: 10px 12px;
                gap: 10px;
            }
            .chat-header {
                padding: 15px 20px;
            }
            .messages-container {
                padding: 20px;
            }
            .message {
                max-width: 85%;
            }
            .input-area {
                padding: 15px 20px;
            }
            .input-area input {
                padding: 12px 18px;
                font-size: 0.9rem;
            }
            .send-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            .modal-card {
                padding: 30px;
            }
            .modal-card h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="scan-line" id="scanLine"></div>
    <div id="particles"></div>
    <div id="loadingIndicator">⏳ 加载中...</div>

    <!-- 错误页面 -->
    <div id="errorPage" class="error-container hidden">
        <div class="error-card">
            <h1>🔗 无效的链接</h1>
            <p style="margin: 20px 0;">该用户编号不存在</p>
            <button class="modal-btn" id="backToAdminBtn">返回管理员</button>
        </div>
    </div>

    <!-- 主应用 -->
    <div id="mainApp" class="glass-orb hidden">
        <div class="app-header">
            <div class="logo-area">
                <div class="logo-icon">ICW</div>
                <span class="logo-text">I.C.W.</span>
            </div>
            <div class="user-badge" id="headerUserBadge">
                <span id="headerName">加载中</span>
                <span class="uid" id="headerUid">#0</span>
                <span id="friendRequestBadge" class="friend-request-badge hidden">0</span>
            </div>
        </div>
        <div class="main-layout">
            <div class="sidebar">
                <div class="profile-card" id="profileSummary">
                    <div class="avatar" id="myAvatar">👤</div>
                    <div class="profile-info">
                        <h4 id="myName">用户名</h4>
                        <p id="myTag">标签</p>
                    </div>
                </div>
                <div class="contact-list" id="contactList"></div>
                <div style="padding: 0 16px 16px 0;" id="adminButtonContainer"></div>
                <div style="padding: 0 16px 16px 0;">
                    <button class="action-btn" style="width:100%;" id="openFriendSearchBtn">+ 添加好友</button>
                </div>
            </div>
            <div class="chat-area">
                <div class="chat-header">
                    <span class="chat-title" id="currentChatName">公屏</span>
                    <div class="chat-actions" id="chatActions"></div>
                </div>
                <div class="messages-container" id="messageList"></div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="键入消息...">
                    <button class="send-btn" id="sendMsg">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 密码验证模态 -->
    <div id="passwordModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>管理员验证</h2>
            <input type="password" id="adminPassword" class="modal-input" placeholder="输入安全密码">
            <div class="modal-buttons">
                <button class="modal-btn" id="submitAdminPassword">确认</button>
            </div>
        </div>
    </div>

    <!-- 首次注册模态 -->
    <div id="registerModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>📇 首次使用</h2>
            <p>UID: <span id="regUid"></span></p>
            <input type="text" id="regName" class="modal-input" placeholder="输入你的称谓" maxlength="20">
            <input type="text" id="regTag" class="modal-input" placeholder="标签 (可选)" maxlength="30">
            <div class="modal-buttons">
                <button class="modal-btn" id="registerConfirm">完成注册</button>
            </div>
        </div>
    </div>

    <!-- 个人信息编辑模态 -->
    <div id="profileModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>个人信息</h2>
            <p>UID: <span id="profileUid"></span></p>
            <input type="text" id="profileName" class="modal-input" placeholder="称谓">
            <input type="text" id="profileTag" class="modal-input" placeholder="标签">
            <div class="modal-buttons">
                <button class="modal-btn" id="saveProfile">保存</button>
                <button class="modal-btn secondary" id="closeProfile">关闭</button>
            </div>
        </div>
    </div>

    <!-- 查看联系人信息模态 -->
    <div id="contactInfoModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>联系人信息</h2>
            <p>称谓: <span id="contactName"></span></p>
            <p>标签: <span id="contactTag"></span></p>
            <p>UID: <span id="contactUid"></span></p>
            <div class="modal-buttons">
                <button class="modal-btn secondary" id="closeContactInfo">关闭</button>
            </div>
        </div>
    </div>

    <!-- 管理员面板 -->
    <div id="adminModal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width:650px;">
            <h2>⚙ 管理控制台</h2>
            <div style="margin:20px 0;">
                <button class="modal-btn" id="createUserBtn">➕ 新增用户（仅生成编号）</button>
            </div>
            <div style="max-height:300px; overflow-y:auto; background: rgba(0,0,0,0.2); border-radius: 30px; padding: 15px;">
                <h3>所有用户</h3>
                <div id="userListAdmin"></div>
            </div>
            <div style="margin-top:16px;">
                <h3>待处理联系申请</h3>
                <div id="pendingContactList" style="max-height:150px; overflow-y:auto;"></div>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn secondary" id="adminClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- 新增用户结果模态 -->
    <div id="newUserResultModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>✅ 用户编号已生成</h2>
            <p id="newUserResult" style="font-size:1.2rem; margin:20px 0;"></p>
            <div class="modal-buttons">
                <button class="modal-btn" id="closeNewUserResult">确定</button>
            </div>
        </div>
    </div>

    <!-- 添加好友模态 -->
    <div id="friendSearchModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>添加好友</h2>
            <input type="text" id="friendSearchInput" class="modal-input" placeholder="输入 UID 或称谓">
            <div id="friendSearchResults" style="max-height:200px; overflow-y:auto; margin:15px 0;"></div>
            <div class="modal-buttons">
                <button class="modal-btn secondary" id="closeFriendSearch">关闭</button>
            </div>
        </div>
    </div>

    <!-- 好友申请列表模态 -->
    <div id="friendRequestsModal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width:550px;">
            <h2>好友申请</h2>
            <div id="friendRequestsList" style="max-height:300px; overflow-y:auto; margin:20px 0;"></div>
            <div class="modal-buttons">
                <button class="modal-btn secondary" id="closeFriendRequests">关闭</button>
            </div>
        </div>
    </div>

    <!-- 欢迎弹窗 -->
    <div id="welcomeModal" class="modal-overlay hidden welcome-modal">
        <div class="modal-card">
            <h2>👋 欢迎</h2>
            <div class="welcome-message" id="welcomeMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="closeWelcome">开始使用</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- Supabase 配置 (已更新为您的新项目) ----------
            const SUPABASE_URL = 'https://rvpqesfwiwceokaphggh.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_fVBYNNUHyWKZv_VszftKWA_UbN4huVD';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // ---------- 常量 ----------
            const ADMIN_PASSWORD = "5720";
            const PUBLIC_ID = "PUBLIC";
            const ADMIN_ID = "0";

            // ---------- 安全编码/解码 ----------
            function encodeId(id) {
                if (id === 0) return "0";
                const step1 = id.toString() + "2077";
                const step2 = BigInt(step1);
                const step3 = step2.toString(2);
                const step4 = BigInt(step3);
                const step5 = step4.toString(8);
                const step6 = BigInt(step5);
                return step6.toString(16);
            }

            function decodeId(encoded) {
                if (encoded === "0") return 0;
                try {
                    const step6 = BigInt("0x" + encoded);
                    const step5 = step6.toString(8);
                    const step4 = BigInt(step5);
                    const step3 = step4.toString(2);
                    const step2 = BigInt(step3);
                    const step1 = step2.toString();
                    if (!step1.endsWith("2077")) throw new Error("Invalid encoding");
                    const idStr = step1.slice(0, -4);
                    return parseInt(idStr, 10);
                } catch (e) {
                    return null;
                }
            }

            function getBasePath() {
                const path = window.location.pathname;
                const lastSlash = path.lastIndexOf('/');
                if (lastSlash === -1) return '/';
                return path.substring(0, lastSlash + 1);
            }

            function getEncodedFromPath() {
                const path = window.location.pathname;
                const segments = path.split('/').filter(s => s.length > 0);
                if (segments.length === 0) return null;
                return segments[segments.length - 1];
            }

            // ---------- 云端操作 ----------
            async function fetchUser(uid) {
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('uid', uid)
                    .single();
                if (error) return null;
                return data;
            }

            async function fetchAllUsers() {
                const { data, error } = await supabase.from('users').select('*');
                if (error) return [];
                return data;
            }

            async function upsertUser(user) {
                const { error } = await supabase
                    .from('users')
                    .upsert(user, { onConflict: 'uid' });
                return !error;
            }

            async function fetchMessages(chatId) {
                const { data, error } = await supabase
                    .from('messages')
                    .select('*')
                    .eq('chat_id', chatId)
                    .order('created_at', { ascending: true });
                if (error) return [];
                return data.map(msg => ({ sender: msg.sender, text: msg.text, time: msg.time }));
            }

            async function addMessageToCloud(chatId, msg) {
                const { error } = await supabase
                    .from('messages')
                    .insert([{ chat_id: chatId, sender: msg.sender, text: msg.text, time: msg.time }]);
                return !error;
            }

            async function deleteMessageFromCloud(chatId, index) {
                const { data, error } = await supabase
                    .from('messages')
                    .select('id')
                    .eq('chat_id', chatId)
                    .order('created_at', { ascending: true });
                if (error || !data || index >= data.length) return false;
                const msgId = data[index].id;
                const { error: delError } = await supabase.from('messages').delete().eq('id', msgId);
                return !delError;
            }

            let messageSubscription = null;

            function subscribeToChat(chatId, onMessage) {
                if (messageSubscription) messageSubscription.unsubscribe();
                messageSubscription = supabase
                    .channel(`chat:${chatId}`)
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                        filter: `chat_id=eq.${chatId}`
                    }, payload => {
                        onMessage({
                            sender: payload.new.sender,
                            text: payload.new.text,
                            time: payload.new.time
                        });
                    })
                    .subscribe();
            }

            // ---------- 全局 ----------
            let currentUser = null;
            let currentChatWith = PUBLIC_ID;
            let allUsersCache = [];

            // ---------- 启动应用 ----------
            async function startApp() {
                const loading = document.getElementById('loadingIndicator');
                loading.classList.add('show');
                console.log('startApp 开始执行');

                try {
                    const encoded = getEncodedFromPath();
                    console.log('路径编码:', encoded);

                    if (!encoded) {
                        window.location.href = getBasePath() + "0";
                        return;
                    }

                    let uid;
                    if (encoded === "0") {
                        uid = ADMIN_ID;
                    } else {
                        const decoded = decodeId(encoded);
                        if (decoded === null) {
                            document.getElementById('errorPage').classList.remove('hidden');
                            loading.classList.remove('show');
                            document.getElementById('backToAdminBtn').onclick = () => {
                                window.location.href = getBasePath() + "0";
                            };
                            return;
                        }
                        uid = decoded.toString();
                    }

                    console.log('解码后UID:', uid);

                    let user = await fetchUser(uid);

                    if (!user && uid === ADMIN_ID) {
                        console.log('管理员不存在，自动创建...');
                        const adminUser = {
                            uid: ADMIN_ID,
                            name: '伊法兰卡',
                            tag: '管理员',
                            avatar: '👤',
                            contacts: [PUBLIC_ID],
                            contact_granted: [],
                            friends: [],
                            is_admin: true,
                            registered: true
                        };
                        const success = await upsertUser(adminUser);
                        if (success) {
                            user = adminUser;
                            console.log('管理员创建成功');
                        } else {
                            alert('管理员创建失败，请检查数据库权限');
                            loading.classList.remove('show');
                            return;
                        }
                    }

                    if (!user) {
                        document.getElementById('errorPage').classList.remove('hidden');
                        loading.classList.remove('show');
                        document.getElementById('backToAdminBtn').onclick = () => {
                            window.location.href = getBasePath() + "0";
                        };
                        return;
                    }

                    if (!user.registered) {
                        document.getElementById('regUid').innerText = uid;
                        document.getElementById('registerModal').classList.remove('hidden');
                        loading.classList.remove('show');
                        document.getElementById('registerConfirm').onclick = async () => {
                            const name = document.getElementById('regName').value.trim();
                            if (!name) { alert('称谓不能为空'); return; }
                            const tag = document.getElementById('regTag').value.trim();
                            user.name = name;
                            user.tag = tag;
                            user.registered = true;
                            user.contacts = [PUBLIC_ID, ADMIN_ID];
                            user.friends = [ADMIN_ID];
                            user.contact_granted = [];
                            const adminUser = await fetchUser(ADMIN_ID);
                            if (adminUser) {
                                if (!adminUser.friends) adminUser.friends = [];
                                if (!adminUser.friends.includes(uid)) {
                                    adminUser.friends.push(uid);
                                    await upsertUser(adminUser);
                                }
                            }
                            const success = await upsertUser(user);
                            if (success) {
                                currentUser = user;
                                document.getElementById('registerModal').classList.add('hidden');
                                document.getElementById('mainApp').classList.remove('hidden');
                                await renderMainApp();
                                showWelcomeModal(true);
                            } else {
                                alert('注册失败，请重试');
                            }
                        };
                    } else {
                        if (uid === ADMIN_ID) {
                            if (sessionStorage.getItem('icw_admin_final') === 'true') {
                                currentUser = user;
                                document.getElementById('mainApp').classList.remove('hidden');
                                loading.classList.remove('show');
                                await renderMainApp();
                                showWelcomeModal(false);
                            } else {
                                loading.classList.remove('show');
                                document.getElementById('passwordModal').classList.remove('hidden');
                                document.getElementById('submitAdminPassword').onclick = async () => {
                                    const pwd = document.getElementById('adminPassword').value;
                                    if (pwd === ADMIN_PASSWORD) {
                                        sessionStorage.setItem('icw_admin_final', 'true');
                                        currentUser = user;
                                        document.getElementById('passwordModal').classList.add('hidden');
                                        document.getElementById('mainApp').classList.remove('hidden');
                                        await renderMainApp();
                                        showWelcomeModal(false);
                                    } else {
                                        alert('密码错误');
                                    }
                                    document.getElementById('adminPassword').value = '';
                                };
                            }
                        } else {
                            currentUser = user;
                            document.getElementById('mainApp').classList.remove('hidden');
                            loading.classList.remove('show');
                            await renderMainApp();
                            showWelcomeModal(false);
                        }
                    }
                } catch (error) {
                    console.error('启动应用出错:', error);
                    loading.classList.remove('show');
                    const encoded = getEncodedFromPath();
                    if (encoded === "0" || !encoded) {
                        try {
                            const adminUser = {
                                uid: ADMIN_ID,
                                name: '伊法兰卡',
                                tag: '管理员',
                                avatar: '👤',
                                contacts: [PUBLIC_ID],
                                contact_granted: [],
                                friends: [],
                                is_admin: true,
                                registered: true
                            };
                            await upsertUser(adminUser);
                            document.getElementById('passwordModal').classList.remove('hidden');
                            document.getElementById('submitAdminPassword').onclick = () => {
                                const pwd = document.getElementById('adminPassword').value;
                                if (pwd === ADMIN_PASSWORD) {
                                    sessionStorage.setItem('icw_admin_final', 'true');
                                    currentUser = adminUser;
                                    document.getElementById('passwordModal').classList.add('hidden');
                                    document.getElementById('mainApp').classList.remove('hidden');
                                    renderMainApp();
                                    showWelcomeModal(false);
                                } else {
                                    alert('密码错误');
                                }
                                document.getElementById('adminPassword').value = '';
                            };
                        } catch (e2) {
                            alert('无法连接到服务器，请检查网络后刷新');
                        }
                    } else {
                        alert('加载失败，请刷新重试。错误信息：' + error.message);
                    }
                }
            }

            // ---------- 显示欢迎弹窗 ----------
            function showWelcomeModal(isNewUser) {
                if (!currentUser) return;
                const firstName = currentUser.name.charAt(0);
                const message = isNewUser ? `欢迎您的加入，${firstName}博士` : `访问请求已收到，欢迎，${firstName}博士`;
                document.getElementById('welcomeMessage').innerText = message;
                document.getElementById('welcomeModal').classList.remove('hidden');
                document.getElementById('closeWelcome').onclick = () => {
                    document.getElementById('welcomeModal').classList.add('hidden');
                };
            }

            // ---------- 渲染主界面 ----------
            async function renderMainApp() {
                if (!currentUser) return;
                document.getElementById('headerName').innerText = currentUser.name;
                document.getElementById('headerUid').innerText = '#' + currentUser.uid;
                document.getElementById('myName').innerText = currentUser.name;
                document.getElementById('myTag').innerText = currentUser.tag || '无标签';
                document.getElementById('myAvatar').innerText = '👤';

                try {
                    const { data: friendReqs } = await supabase
                        .from('friend_requests')
                        .select('*')
                        .eq('to_uid', currentUser.uid)
                        .eq('status', 'pending');
                    const pendingCount = friendReqs ? friendReqs.length : 0;
                    const badge = document.getElementById('friendRequestBadge');
                    badge.classList.toggle('hidden', pendingCount === 0);
                    if (pendingCount > 0) badge.innerText = pendingCount;
                } catch (e) {
                    console.warn('获取好友申请失败', e);
                }

                try {
                    allUsersCache = await fetchAllUsers();
                } catch (e) {
                    console.warn('获取用户列表失败', e);
                    allUsersCache = [];
                }

                const friends = currentUser.friends || [];
                let html = `
                        <div class="contact-category">📢 公共</div>
                        <div class="contact-item ${currentChatWith === PUBLIC_ID ? 'active' : ''}" data-chatid="${PUBLIC_ID}" data-type="public">
                            <div class="contact-avatar">🌐</div>
                            <div class="contact-info"><div class="contact-name">公屏</div></div>
                        </div>
                    `;

                if (currentUser.uid !== ADMIN_ID) {
                    html += `
                            <div class="contact-category">🔷 伊法兰卡</div>
                            <div class="contact-item ${currentChatWith === ADMIN_ID ? 'active' : ''}" data-chatid="${ADMIN_ID}" data-type="admin">
                                <div class="contact-avatar">👑</div>
                                <div class="contact-info"><div class="contact-name">伊法兰卡</div></div>
                            </div>
                        `;
                }

                if (friends.length > 0) {
                    html += `<div class="contact-category">👥 好友</div>`;
                    friends.forEach(fuid => {
                        if (fuid === ADMIN_ID) return;
                        const friend = allUsersCache.find(u => u.uid === fuid);
                        if (friend) {
                            html += `<div class="contact-item ${currentChatWith === fuid ? 'active' : ''}" data-chatid="${fuid}" data-type="friend">
                                    <div class="contact-avatar">👤</div>
                                    <div class="contact-info">
                                        <div class="contact-name">${friend.name}</div>
                                        <div class="contact-tag">${friend.tag || ''}</div>
                                    </div>
                                </div>`;
                        }
                    });
                }

                document.getElementById('contactList').innerHTML = html;

                document.querySelectorAll('.contact-item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.contact-avatar')) return;
                        const chatId = el.dataset.chatid;
                        if (chatId) switchChat(chatId);
                    });
                    const avatar = el.querySelector('.contact-avatar');
                    if (avatar) {
                        avatar.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const type = el.dataset.type;
                            const chatId = el.dataset.chatid;
                            if (type === 'public') {
                                showContactInfo('公屏', '公共聊天室', PUBLIC_ID);
                            } else if (type === 'admin') {
                                const admin = allUsersCache.find(u => u.uid === ADMIN_ID);
                                showContactInfo(admin ? admin.name : '伊法兰卡', admin ? admin.tag || '管理员' :
                                    '管理员', ADMIN_ID);
                            } else if (type === 'friend') {
                                const friend = allUsersCache.find(u => u.uid === chatId);
                                if (friend) showContactInfo(friend.name, friend.tag || '无', friend.uid);
                            }
                        });
                    }
                });

                const adminBtnContainer = document.getElementById('adminButtonContainer');
                if (currentUser.is_admin) {
                    adminBtnContainer.innerHTML =
                        `<button class="action-btn" style="width:100%;" id="adminPanelBtn">⚙ 管理控制台</button>`;
                    document.getElementById('adminPanelBtn').addEventListener('click', () => {
                        loadAdminPanel();
                        document.getElementById('adminModal').classList.remove('hidden');
                    });
                } else {
                    adminBtnContainer.innerHTML = '';
                }

                if (!currentChatWith) switchChat(PUBLIC_ID);
                else switchChat(currentChatWith);
            }

            function showContactInfo(name, tag, uid) {
                document.getElementById('contactName').innerText = name;
                document.getElementById('contactTag').innerText = tag;
                document.getElementById('contactUid').innerText = uid;
                document.getElementById('contactInfoModal').classList.remove('hidden');
                document.getElementById('closeContactInfo').onclick = () => {
                    document.getElementById('contactInfoModal').classList.add('hidden');
                };
            }

            async function switchChat(chatId) {
                currentChatWith = chatId;
                document.querySelectorAll('.contact-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.chatid === chatId);
                });
                const chatIdForStorage = chatId === PUBLIC_ID ? PUBLIC_ID : getPrivateChatId(currentUser.uid, chatId);
                subscribeToChat(chatIdForStorage, async () => {
                    await loadMessages(chatId);
                });
                await loadMessages(chatId);
                updateChatHeader(chatId);
            }

            async function loadMessages(chatId) {
                const chatIdForStorage = chatId === PUBLIC_ID ? PUBLIC_ID : getPrivateChatId(currentUser.uid, chatId);
                const msgs = await fetchMessages(chatIdForStorage);
                const container = document.getElementById('messageList');
                let html = '';
                msgs.forEach((msg, index) => {
                    const isOwn = msg.sender === currentUser.uid;
                    const sender = allUsersCache.find(u => u.uid === msg.sender);
                    const senderName = sender ? sender.name : msg.sender;
                    html += `
                            <div class="message ${isOwn ? 'own' : ''}" data-msg-index="${index}">
                                <div class="message-avatar" data-sender="${msg.sender}">👤</div>
                                <div class="message-bubble">
                                    <div class="message-sender">${senderName}</div>
                                    <div>${msg.text}</div>
                                    <div class="message-time">${msg.time}</div>
                                    ${currentUser.is_admin ? `<button class="delete-msg-btn" data-chatid="${chatId}" data-index="${index}">✕</button>` : ''}
                                </div>
                            </div>
                        `;
                });
                container.innerHTML = html || '<div style="text-align:center; color:#6b8ba0; padding:30px;">暂无消息</div>';
                container.scrollTop = container.scrollHeight;

                document.querySelectorAll('.message-avatar').forEach(avatar => {
                    avatar.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const senderUid = avatar.dataset.sender;
                        if (senderUid === PUBLIC_ID) {
                            showContactInfo('公屏', '公共聊天室', PUBLIC_ID);
                            return;
                        }
                        const sender = allUsersCache.find(u => u.uid === senderUid) || await fetchUser(
                        senderUid);
                        if (sender) {
                            showContactInfo(sender.name, sender.tag || '无', sender.uid);
                        }
                    });
                });

                if (currentUser.is_admin) {
                    document.querySelectorAll('.delete-msg-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const chatId = btn.dataset.chatid;
                            const index = parseInt(btn.dataset.index, 10);
                            if (confirm('确定删除此消息？')) {
                                const chatIdForStorage = chatId === PUBLIC_ID ? PUBLIC_ID :
                                    getPrivateChatId(currentUser.uid, chatId);
                                const success = await deleteMessageFromCloud(chatIdForStorage, index);
                                if (success) await loadMessages(chatId);
                                else alert('删除失败');
                            }
                        });
                    });
                }
            }

            function updateChatHeader(chatId) {
                const title = document.getElementById('currentChatName');
                const actions = document.getElementById('chatActions');
                actions.innerHTML = '';
                if (chatId === PUBLIC_ID) {
                    title.innerText = '公屏';
                } else if (chatId === ADMIN_ID) {
                    title.innerText = '伊法兰卡';
                    if (currentUser.uid !== ADMIN_ID) {
                        if (!(currentUser.contact_granted || []).includes(ADMIN_ID)) {
                            addActionButton('📞 申请联系', requestContact);
                        } else {
                            addActionButton('📞 拨打电话', () => window.location.href = 'tel:+8615986785788');
                            addActionButton('💬 QQ', () => window.open('https://qm.qq.com/q/JObrZqjBqS',
                                '_blank'));
                        }
                    }
                } else {
                    const friend = allUsersCache.find(u => u.uid === chatId);
                    title.innerText = friend ? friend.name : '好友';
                }
                addActionButton('📋 好友申请', () => loadFriendRequestsModal());

                function addActionButton(text, onClick) {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.innerText = text;
                    btn.onclick = onClick;
                    actions.appendChild(btn);
                }
            }

            // ---------- 好友系统 ----------
            async function requestContact() {
                const { data: existing } = await supabase
                    .from('contact_requests')
                    .select('*')
                    .eq('from_uid', currentUser.uid)
                    .eq('to_uid', ADMIN_ID);
                if (!existing || existing.length === 0) {
                    await supabase
                        .from('contact_requests')
                        .insert([{ from_uid: currentUser.uid, to_uid: ADMIN_ID, time: new Date().toLocaleString() }]);
                    alert('联系申请已发送');
                } else {
                    alert('已申请过');
                }
            }

            document.getElementById('openFriendSearchBtn').addEventListener('click', () => {
                document.getElementById('friendSearchInput').value = '';
                document.getElementById('friendSearchResults').innerHTML = '';
                document.getElementById('friendSearchModal').classList.remove('hidden');
            });

            document.getElementById('friendSearchInput').addEventListener('input', (e) => {
                const query = e.target.value.trim();
                if (!query) { document.getElementById('friendSearchResults').innerHTML = ''; return; }
                const users = allUsersCache.filter(u => u.uid !== currentUser.uid && u.uid !== ADMIN_ID && u.uid !==
                    PUBLIC_ID && u.registered === true);
                const results = users.filter(u => u.uid.includes(query) || (u.name && u.name.includes(query)));
                let html = '';
                results.forEach(u => {
                    const alreadyFriend = (currentUser.friends || []).includes(u.uid);
                    html += `
                            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #2b5580;">
                                <span>${u.name} (${u.uid})</span>
                                ${!alreadyFriend ? `<button class="action-btn" data-send="${u.uid}">发送申请</button>` : `<span style="color:#6b8ba0;">已是好友</span>`}
                            </div>
                        `;
                });
                document.getElementById('friendSearchResults').innerHTML = html || '无匹配用户';
                document.querySelectorAll('[data-send]').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const toUid = e.target.dataset.send;
                        await supabase
                            .from('friend_requests')
                            .insert([{ from_uid: currentUser.uid, to_uid: toUid, status: 'pending',
                                time: new Date().toISOString() }]);
                        alert('好友申请已发送');
                        document.getElementById('friendSearchInput').value = '';
                        document.getElementById('friendSearchResults').innerHTML = '';
                        renderMainApp();
                    });
                });
            });

            document.getElementById('closeFriendSearch').addEventListener('click', () => {
                document.getElementById('friendSearchModal').classList.add('hidden');
            });

            async function loadFriendRequestsModal() {
                const { data: reqs } = await supabase
                    .from('friend_requests')
                    .select('*')
                    .eq('to_uid', currentUser.uid)
                    .eq('status', 'pending');
                const listDiv = document.getElementById('friendRequestsList');
                if (!reqs || reqs.length === 0) {
                    listDiv.innerHTML = '<p style="text-align:center;">暂无待处理的好友申请</p>';
                } else {
                    let html = '';
                    reqs.forEach((req, idx) => {
                        const fromUser = allUsersCache.find(u => u.uid === req.from_uid);
                        html += `
                                <div class="friend-request-item">
                                    <span>${fromUser ? fromUser.name : req.from_uid} 想要添加你为好友</span>
                                    <div>
                                        <button class="action-btn" data-accept="${req.id}">同意</button>
                                        <button class="action-btn" data-reject="${req.id}">拒绝</button>
                                    </div>
                                </div>
                            `;
                    });
                    listDiv.innerHTML = html;

                    document.querySelectorAll('[data-accept]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const reqId = e.target.dataset.accept;
                            const { data: req } = await supabase
                                .from('friend_requests')
                                .select('*')
                                .eq('id', reqId)
                                .single();
                            if (req && req.to_uid === currentUser.uid) {
                                if (!currentUser.friends) currentUser.friends = [];
                                if (!currentUser.friends.includes(req.from_uid)) currentUser.friends
                                    .push(req.from_uid);
                                const fromUser = allUsersCache.find(u => u.uid === req.from_uid);
                                if (fromUser) {
                                    if (!fromUser.friends) fromUser.friends = [];
                                    if (!fromUser.friends.includes(currentUser.uid)) fromUser.friends
                                        .push(currentUser.uid);
                                    await upsertUser(fromUser);
                                }
                                await upsertUser(currentUser);
                                await supabase
                                    .from('friend_requests')
                                    .update({ status: 'accepted' })
                                    .eq('id', reqId);
                                loadFriendRequestsModal();
                                renderMainApp();
                            }
                        });
                    });

                    document.querySelectorAll('[data-reject]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const reqId = e.target.dataset.reject;
                            await supabase
                                .from('friend_requests')
                                .update({ status: 'rejected' })
                                .eq('id', reqId);
                            loadFriendRequestsModal();
                        });
                    });
                }
                document.getElementById('friendRequestsModal').classList.remove('hidden');
            }

            document.getElementById('closeFriendRequests').addEventListener('click', () => {
                document.getElementById('friendRequestsModal').classList.add('hidden');
            });

            // ---------- 消息发送 ----------
            document.getElementById('sendMsg').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter')
                    sendMessage(); });
            async function sendMessage() {
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text || !currentChatWith) return;
                let chatId = currentChatWith;
                if (currentChatWith !== PUBLIC_ID) {
                    chatId = getPrivateChatId(currentUser.uid, currentChatWith);
                }
                const msg = {
                    sender: currentUser.uid,
                    text: text,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                const success = await addMessageToCloud(chatId, msg);
                if (success) input.value = '';
                else alert('发送失败，请重试');
            }

            function getPrivateChatId(uid1, uid2) {
                return [uid1, uid2].sort().join('_');
            }

            // ---------- 个人信息 ----------
            document.getElementById('profileSummary').addEventListener('click', () => {
                document.getElementById('profileUid').innerText = currentUser.uid;
                document.getElementById('profileName').value = currentUser.name || '';
                document.getElementById('profileTag').value = currentUser.tag || '';
                document.getElementById('profileModal').classList.remove('hidden');
            });
            document.getElementById('saveProfile').addEventListener('click', async () => {
                const newName = document.getElementById('profileName').value.trim();
                if (!newName) return alert('称谓不能为空');
                currentUser.name = newName;
                currentUser.tag = document.getElementById('profileTag').value.trim();
                const success = await upsertUser(currentUser);
                if (success) {
                    document.getElementById('profileModal').classList.add('hidden');
                    renderMainApp();
                } else {
                    alert('保存失败');
                }
            });
            document.getElementById('closeProfile').addEventListener('click', () => document.getElementById('profileModal')
                .classList.add('hidden'));

            // ---------- 管理员面板 ----------
            async function loadAdminPanel() {
                try {
                    allUsersCache = await fetchAllUsers();
                } catch (e) {
                    console.warn('获取用户列表失败', e);
                    allUsersCache = [];
                }
                const users = allUsersCache;
                let html = '';
                users.forEach(u => {
                    if (u.uid !== ADMIN_ID) {
                        const status = u.registered ? '已注册' : '未注册';
                        html += `<div style="display:flex; justify-content:space-between; margin:10px 0;">
                                <span>${u.name || '（未设置）'} (${u.uid}) [${status}]</span>
                                <div>
                                    <button class="action-btn" data-login="${u.uid}" ${!u.registered ? 'disabled' : ''}>登录</button>
                                    <button class="action-btn" data-delete="${u.uid}">注销</button>
                                    <button class="action-btn" data-grant="${u.uid}" ${!u.registered ? 'disabled' : ''}>授予联系</button>
                                </div>
                            </div>`;
                    }
                });
                document.getElementById('userListAdmin').innerHTML = html || '暂无其他用户';

                document.querySelectorAll('[data-login]').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const targetUid = e.target.dataset.login;
                        const target = users.find(u => u.uid === targetUid);
                        if (target && target.registered) {
                            currentUser = target;
                            document.getElementById('adminModal').classList.add('hidden');
                            const encoded = target.uid === ADMIN_ID ? "0" : encodeId(parseInt(target.uid,
                            10));
                            window.history.pushState(null, '', getBasePath() + encoded);
                            renderMainApp();
                        }
                    });
                });
                document.querySelectorAll('[data-delete]').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const targetUid = e.target.dataset.delete;
                        if (confirm(`注销用户 ${targetUid}？`)) {
                            await supabase.from('users').delete().eq('uid', targetUid);
                            allUsersCache = await fetchAllUsers();
                            loadAdminPanel();
                        }
                    });
                });
                document.querySelectorAll('[data-grant]').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const targetUid = e.target.dataset.grant;
                        const user = users.find(u => u.uid === targetUid);
                        if (user && user.registered) {
                            if (!user.contact_granted) user.contact_granted = [];
                            if (!user.contact_granted.includes(ADMIN_ID)) {
                                user.contact_granted.push(ADMIN_ID);
                                await upsertUser(user);
                                alert('已授予联系权限');
                            }
                        }
                    });
                });

                const { data: contactReqs } = await supabase.from('contact_requests').select('*');
                let reqHtml = '';
                (contactReqs || []).forEach((req, idx) => {
                    const from = allUsersCache.find(u => u.uid === req.from_uid);
                    reqHtml +=
                        `<div>${from ? from.name : req.from_uid} 申请联系 <button class="action-btn" data-accept="${req.id}">同意</button></div>`;
                });
                document.getElementById('pendingContactList').innerHTML = reqHtml || '无';
                document.querySelectorAll('[data-accept]').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const reqId = e.target.dataset.accept;
                        const { data: req } = await supabase
                            .from('contact_requests')
                            .select('*')
                            .eq('id', reqId)
                            .single();
                        if (req) {
                            const user = allUsersCache.find(u => u.uid === req.from_uid);
                            if (user && user.registered) {
                                if (!user.contact_granted) user.contact_granted = [];
                                if (!user.contact_granted.includes(ADMIN_ID)) {
                                    user.contact_granted.push(ADMIN_ID);
                                    await upsertUser(user);
                                }
                            }
                            await supabase.from('contact_requests').delete().eq('id', reqId);
                            loadAdminPanel();
                        }
                    });
                });
            }

            document.getElementById('createUserBtn').addEventListener('click', async () => {
                const users = allUsersCache;
                let maxId = 0;
                users.forEach(u => { if (!isNaN(u.uid) && parseInt(u.uid) > maxId) maxId = parseInt(u.uid); });
                const newUid = (maxId + 1).toString();
                const newUser = {
                    uid: newUid,
                    name: '',
                    tag: '',
                    avatar: '👤',
                    contacts: [],
                    contact_granted: [],
                    friends: [],
                    is_admin: false,
                    registered: false
                };
                await upsertUser(newUser);
                allUsersCache.push(newUser);
                const encoded = encodeId(parseInt(newUid, 10));
                const link = `${window.location.origin}${getBasePath()}${encoded}`;
                document.getElementById('newUserResult').innerText = `编号: ${newUid}\n编码链接: ${link}`;
                document.getElementById('newUserResultModal').classList.remove('hidden');
            });

            document.getElementById('closeNewUserResult').addEventListener('click', () => {
                document.getElementById('newUserResultModal').classList.add('hidden');
            });
            document.getElementById('adminClose').addEventListener('click', () => document.getElementById('adminModal')
                .classList.add('hidden'));

            // ---------- 粒子背景 ----------
            (function createParticles() {
                const container = document.getElementById('particles');
                for (let i = 0; i < 40; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const s = Math.random() * 180 + 40;
                    p.style.width = s + 'px';
                    p.style.height = s + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = Math.random() * 100 + '%';
                    p.style.animationDuration = (Math.random() * 10 + 8) + 's';
                    p.style.animationDelay = Math.random() * 5 + 's';
                    container.appendChild(p);
                }
            })();

            // ---------- 启动流程 ----------
            const scanLine = document.getElementById('scanLine');
            if (scanLine) {
                scanLine.style.opacity = '1';
                scanLine.style.animation = 'scan 1s ease-out forwards';
                scanLine.addEventListener('animationend', function() {
                    startApp();
                }, { once: true });
                setTimeout(() => {
                    if (!window.appStarted) {
                        window.appStarted = true;
                        startApp();
                    }
                }, 2000);
            } else {
                startApp();
            }
            window.appStarted = false;
        })();
    </script>
</body>
</html>
